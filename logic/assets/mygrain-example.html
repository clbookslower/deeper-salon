<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 결</title>
<!-- 외부에서 받아 오는 것 0 — 폰트도 링크하지 않는다(비행기·지하철에서도 열린다). 시스템 글꼴로 앉힌다. -->
<style>
  :root{
    --cream:#FBF7EE; --deep:#1A4A35; --night:#0F2D1F; --gold:#E2C77B;
    --ink:#233A2E; --muted:#6E7F74; --line:#DCD3C2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.75;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto}
  .pad{padding:0 20px}

  /* 머리 */
  header{background:var(--cream);text-align:center;padding:34px 20px 26px}
  header img{height:40px;width:auto;display:block;margin:0 auto 16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);margin:0 0 10px}
  h1{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:600;color:var(--deep);
     font-size:clamp(24px,6vw,32px);margin:0 0 8px;word-break:keep-all}
  .period{font-size:13px;color:var(--muted);margin:0}

  /* 밤 밴드 — 서열 띠 */
  .night{background:linear-gradient(180deg,var(--night),var(--deep));
         padding:30px 20px 26px;color:var(--cream)}
  .night h2{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:400;font-size:14px;
            letter-spacing:.14em;color:var(--gold);margin:0 0 18px;text-align:center}
  .seq{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 16px}
  .base{width:34px;height:34px;border:1px solid rgba(226,199,123,.45);border-radius:3px;
        display:flex;align-items:center;justify-content:center;position:relative;
        font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:16px;color:var(--gold);background:rgba(226,199,123,.07)}
  .base.on{background:rgba(226,199,123,.22);border-color:var(--gold)}
  .base .dot{position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:50%;
             background:var(--gold)}
  .caption{text-align:center;font-size:12.5px;color:rgba(251,247,238,.72);margin:0}

  /* 씨앗 줄 */
  .seeds{list-style:none;margin:20px 0 0;padding:0}
  .seeds li{border-top:1px solid rgba(226,199,123,.18);padding:11px 0;display:flex;gap:11px;align-items:flex-start}
  .seeds .ltr{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;color:var(--gold);width:1.4em;flex:none;font-size:15px}
  .seeds .txt{font-size:13.5px;color:rgba(251,247,238,.93);word-break:keep-all}
  .seeds .meta{display:block;font-size:11.5px;color:rgba(251,247,238,.58);margin-top:3px}

  /* 본문 절 */
  section{padding:30px 20px}
  h3{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:600;color:var(--deep);
     font-size:17px;margin:0 0 4px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:keep-all}
  th{font-weight:500;font-size:11.5px;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--deep)}
  td.codon{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;color:var(--deep);white-space:nowrap}
  td.word{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:15px;color:var(--deep)}
  td.src{color:var(--muted);font-size:12.5px}

  .chain{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:clamp(17px,4.6vw,21px);
         color:var(--deep);line-height:1.9;word-break:keep-all;margin:0}
  .chain em{font-style:normal;color:var(--gold);padding:0 .28em}

  .fox{background:var(--deep);color:var(--cream);padding:26px 20px;text-align:center}
  .fox p{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:clamp(15px,4.2vw,18px);
         line-height:1.95;margin:0 0 12px;word-break:keep-all}
  .fox .mark{font-size:18px}

  /* 접힘 카드 */
  .cards{display:grid;gap:12px;margin:0}
  .card{border:1px solid var(--line);border-radius:4px;padding:15px 16px;background:#fff}
  .card .name{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:16px;color:var(--deep);margin:0 0 9px}
  .card dl{margin:0;font-size:12.5px}
  .card dt{color:var(--muted);font-size:11px;letter-spacing:.06em;margin-top:7px}
  .card dd{margin:2px 0 0;word-break:keep-all}

  footer{padding:26px 20px 40px;text-align:center;border-top:1px solid var(--line)}
  footer .line{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:14px;color:var(--deep);
               word-break:keep-all;margin:0 0 8px}
  footer .date{font-size:11.5px;color:var(--muted);margin:0}

  @media (max-width:380px){
    .base{width:30px;height:30px;font-size:15px}
    th,td{padding:9px 5px}
  }
</style>
</head>
<body><aside style="padding:12px;text-align:center;background:#ece4d4;color:#233a2e;font:13px/1.6 sans-serif">안내용 가상 자료로 채운 결과 예시 · 실제 멤버의 기록이 아닙니다.</aside>
<div class="wrap">

  <header>
    <!-- 로고: DEEPER_logo.png를 base64로 내장한다. 못 찾으면 이 img 줄을 지운다. -->
    <img id="logo" alt="DEEPER" src="">
    <p class="eyebrow">DEEPER OS · 나만의 결</p>
    <h1 id="title">결</h1>
    <p class="period" id="period"></p>
  </header>

  <div class="night">
    <h2>서 열</h2>
    <div class="seq" id="seq"></div>
    <p class="caption" id="seqcap"></p>
    <ul class="seeds" id="seeds"></ul>
  </div>

  <section>
    <h3>코돈</h3>
    <p class="sub">세 알씩 묶어 낱말 하나를 물어 옵니다. 겹치는 낱말을 먼저 놓고, 없으면 씨앗에서 한 낱말을 고릅니다.</p>
    <table>
      <thead><tr><th>세 글자</th><th>낱말</th><th>근거가 된 말</th></tr></thead>
      <tbody id="codons"></tbody>
    </table>
  </section>

  <section>
    <h3>낱말 사슬</h3>
    <p class="sub">발견일 순으로 이었습니다. 보탠 낱말은 없습니다.</p>
    <p class="chain" id="chain"></p>
  </section>

  <div class="fox">
    <p id="foxline"></p>
    <div class="mark">🦊</div>
  </div>

  <section id="foldsec">
    <h3>접힘</h3>
    <p class="sub">이 낱말들이 어떤 모양이 되는지. 고르는 손은 늘 당신입니다.</p>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <p class="line">결은 내가 자란 방향이다. 여우는 그것을 옮겨 적었을 뿐이다.</p>
    <p class="date" id="made"></p>
  </footer>

</div>

(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  if(!DATA.로고base64){ const l=$('logo'); if(l) l.remove(); }
  else { $('logo').src = "data:image/png;base64," + DATA.로고base64; }

  $('title').textContent = DATA.호칭 + "의 결";
  $('period').textContent = DATA.기간 || "";
  $('made').textContent = "지은 날 " + (DATA.지은날 || "");

  const seeds = DATA.씨앗 || [];
  $('seq').innerHTML = seeds.map(s =>
    `<div class="base${s.전사?' on':''}">${esc(s.글자)}${s.전사?'<span class="dot"></span>':''}</div>`
  ).join('');
  const n = seeds.filter(s=>s.전사).length;
  $('seqcap').textContent = `씨앗 ${seeds.length}알 가운데 ${n}알이 옮겨 적혔습니다`;
  $('seeds').innerHTML = seeds.map(s =>
    `<li><span class="ltr">${esc(s.글자)}</span><span class="txt">${esc(s.문장)}
     <span class="meta">${esc(s.날짜)} · ${esc(s.출처||'')}${s.전사?' · ●':''}</span></span></li>`
  ).join('');

  $('codons').innerHTML = (DATA.코돈||[]).map(c =>
    `<tr><td class="codon">${esc(c.세글자)}</td><td class="word">${esc(c.낱말)}</td>
     <td class="src">${esc(c.근거||'')}</td></tr>`
  ).join('');

  $('chain').innerHTML = (DATA.사슬||[]).map(esc).join('<em>·</em>') || '-';
  $('foxline').textContent = DATA.여우의한줄 || '';

  const folds = DATA.접힘 || [];
  if(!folds.length){ $('foldsec').remove(); }
  else $('cards').innerHTML = folds.map(f =>
    `<div class="card"><p class="name">${esc(f.이름)}</p><dl>` +
    (f.줄||[]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') +
    `</dl></div>`
  ).join('');
})();
</script>
