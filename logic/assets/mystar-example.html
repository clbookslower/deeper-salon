<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 별</title>
<!-- 외부에서 받아 오는 것 0 — 폰트도 링크하지 않는다(비행기·지하철에서도 열린다). 시스템 글꼴로 앉힌다. -->
<style>
  :root{
    --cream:#FBF7EE; --deep:#1A4A35; --night:#0F2D1F; --gold:#E2C77B;
    --ink:#233A2E; --muted:#6E7F74; --line:#DCD3C2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.75;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto}

  /* 머리 */
  header{background:var(--cream);text-align:center;padding:34px 20px 26px}
  header img{height:40px;width:auto;display:block;margin:0 auto 16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);margin:0 0 10px}
  h1{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:600;color:var(--deep);
     font-size:clamp(24px,6vw,32px);margin:0 0 8px;word-break:keep-all}
  .period{font-size:13px;color:var(--muted);margin:0}

  /* 밤 밴드 — 별자리 */
  .night{background:linear-gradient(180deg,var(--night),var(--deep));
         padding:26px 12px 22px;color:var(--cream)}
  .night h2{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:400;font-size:14px;
            letter-spacing:.3em;text-align:center;margin:0 0 14px;color:var(--gold);opacity:.9}
  .sky{display:block;width:100%;height:auto}
  .sky .lnk{stroke:var(--gold);stroke-opacity:.38;stroke-width:1}
  .sky .core{fill:var(--gold)}
  .sky .dot{fill:var(--cream);fill-opacity:.92}
  .sky .empty{fill:none;stroke:var(--cream);stroke-opacity:.45;stroke-dasharray:2 2}
  .sky text{fill:var(--cream);font-size:10.5px;opacity:.88}
  .night .caption{text-align:center;font-size:12px;color:var(--cream);opacity:.62;margin:12px 0 0}

  /* 자리 카드 */
  section{padding:26px 20px 4px}
  h3{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-weight:600;color:var(--deep);
     font-size:17px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
  .cards{display:grid;gap:12px}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
  .card .name{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:16px;color:var(--deep);margin:0 0 8px}
  .card .quote{margin:0;font-size:14px;word-break:keep-all}
  .card .meta{margin:6px 0 0;font-size:12px;color:var(--muted)}
  .card.none .quote{color:var(--muted)}

  /* 재료가 된 씨앗 */
  .seeds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .seeds li{display:flex;gap:10px;align-items:flex-start;font-size:14px;word-break:keep-all}
  .seeds .to{flex:none;font-size:12px;color:var(--muted);padding-top:3px}

  footer{text-align:center;padding:28px 20px 40px}
  footer .line{font-family:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;font-size:14px;color:var(--deep);
               margin:0 0 6px;word-break:keep-all}
  footer .date{font-size:12px;color:var(--muted);margin:0}

  @media (max-width:420px){
    section{padding:22px 16px 4px}
    header{padding:28px 16px 22px}
    .night{padding:22px 8px 18px}
  }
</style>
</head>
<body><aside style="padding:12px;text-align:center;background:#ece4d4;color:#233a2e;font:13px/1.6 sans-serif">안내용 가상 자료로 채운 결과 예시 · 실제 멤버의 기록이 아닙니다.</aside>
<div class="wrap">

  <header>
    <!-- 로고: DEEPER_logo.png를 base64로 내장한다. 못 찾으면 이 img 줄을 지운다. -->

    <p class="eyebrow">DEEPER OS · 나만의 별</p>
    <h1 id="title">별</h1>
    <p class="period" id="period"></p>
  </header>

  <div class="night">
    <h2>별 자 리</h2>
    <svg class="sky" id="sky" viewBox="-20 0 400 300" role="img" aria-label="논리의 달 별자리"></svg>
    <p class="caption" id="skycap"></p>
  </div>

  <section>
    <h3>구조</h3>
    <p class="sub">논리의 달에 지은 자리들. 없는 자리는 비워 두었습니다.</p>
    <div class="cards" id="cards"></div>
  </section>

  <section id="seedsec">
    <h3>재료가 된 씨앗</h3>
    <p class="sub">이 구조가 어느 문장에서 왔는지.</p>
    <ul class="seeds" id="seeds"></ul>
  </section>

  <footer>
    <p class="line">부분에는 없던 것이 전체에서 솟는다.</p>
    <p class="date" id="made"></p>
  </footer>

</div>

<script>
/* ★DATA — 여기만 그 사람의 실측으로 갈아 끼운다. 위의 구조·색은 건드리지 않는다. ★ */
const DATA = {"호칭": "견본", "여정": "가상 자료 · 논리의 달 24/33", "지은날": "2026-09-21", "자리": [{"이름": "공리", "있음": true, "첫문장": "대패를 밀고 다시 당기며 나뭇결을 읽는다.", "날짜": "2026-09-07"}, {"이름": "단 한 사람", "있음": true, "첫문장": "대패의 날을 처음 살피는 사람.", "날짜": "2026-09-08"}, {"이름": "고리", "있음": true, "첫문장": "옹이 앞에서 멈추고 나무를 돌린다.", "날짜": "2026-09-09"}, {"이름": "루틴", "있음": true, "첫문장": "먼저 대패의 날을 살핀다.", "날짜": "2026-09-10"}, {"이름": "악보", "있음": false, "첫문장": "아직 없는 자리입니다.", "날짜": ""}], "씨앗": [{"문장": "대패를 밀고 다시 당기며 나뭇결을 읽는다.", "간자리": "공리"}, {"문장": "먼저 대패의 날을 살핀다.", "간자리": "루틴"}, {"문장": "옹이 앞에서 멈추고 나무를 돌린다.", "간자리": "고리"}]};
/* ★DATA 끝 ★ */

(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  $('title').textContent = DATA.호칭 + '의 구조';
  $('period').textContent = DATA.여정;
  $('made').textContent = '지은 날 ' + DATA.지은날;
  if (!$('logo').getAttribute('src')) $('logo').remove();

  // ── 별자리: 가운데 별 하나에서 자리 수만큼 선이 뻗는다
  const list = DATA.자리 || [];
  const cx = 180, cy = 150, R = 92;
  const parts = [];
  const n = Math.max(list.length, 1);
  list.forEach((z, i) => {
    const a = -Math.PI/2 + (2*Math.PI*i)/n;
    const x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
    parts.push(`<line class="lnk" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`);
    parts.push(z.있음
      ? `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>`
      : `<circle class="empty" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>`);
    // 이름 — 자리 이름 그대로. 좌우에 따라 정렬을 바꿔 잘리지 않게 한다(자르지 않는다).
    const anchor = Math.cos(a) > 0.25 ? 'start' : (Math.cos(a) < -0.25 ? 'end' : 'middle');
    const tx = x + (anchor === 'start' ? 9 : anchor === 'end' ? -9 : 0);
    const ty = y + (Math.abs(Math.cos(a)) < 0.25 ? (Math.sin(a) > 0 ? 18 : -12) : 4);
    parts.push(`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${esc(z.이름)}</text>`);
  });
  parts.push(`<circle class="core" cx="${cx}" cy="${cy}" r="7"/>`);
  $('sky').innerHTML = parts.join('');

  const have = list.filter(z => z.있음).length;
  $('skycap').textContent = have + '개의 자리가 섰습니다.' +
    (have < list.length ? ' 빈 점은 아직 오지 않은 자리예요.' : '');

  // ── 자리 카드
  $('cards').innerHTML = list.map(z => `
    <div class="card${z.있음 ? '' : ' none'}">
      <p class="name">${esc(z.이름)}</p>
      <p class="quote">${z.있음 ? '「' + esc(z.첫문장) + '」' : esc(z.첫문장)}</p>
      ${z.날짜 ? `<p class="meta">${esc(z.날짜)}</p>` : ''}
    </div>`).join('');

  // ── 재료가 된 씨앗
  const seeds = DATA.씨앗 || [];
  if (!seeds.length) { $('seedsec').remove(); }
  else {
    $('seeds').innerHTML = seeds.map(s => `
      <li><span class="to">→ ${esc(s.간자리)}</span><span>「${esc(s.문장)}」</span></li>`).join('');
  }
})();
</script>
</body>
</html>
